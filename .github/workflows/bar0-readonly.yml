name: Read-only BAR0 adapter (fake sysfs and RAM only)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  readonly-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_bar0_readonly.py' -v
      - run: python3 -m design.p104_bar0_ro_build --directory ./work/bar0-ro-native
      - uses: actions/upload-artifact@v4
        with:
          name: bar0-readonly-native-audit
          path: work/bar0-ro-native/p104_bar0_ro.json
