name: RAM mmap adapter (no devices)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mmap-ram:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_mmap_ram_adapter.py' -v
      - run: python3 -m design.p104_mmap_ram > mmap-ram-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: mmap-ram-audit
          path: mmap-ram-audit.json
