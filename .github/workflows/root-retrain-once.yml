name: Root retrain once (fixtures only)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  root-retrain-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_root_retrain_once.py' -v
